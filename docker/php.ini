; Reglages PHP de production Maboko.

; Une image de 5 Mo transmise en base64 approche 7 Mo dans le corps de la
; requete. Les valeurs par defaut de PHP (8 Mo pour post_max_size) la
; refuseraient sans message clair.
post_max_size = 20M
upload_max_filesize = 20M
memory_limit = 256M

max_execution_time = 60

; Les erreurs partent dans le journal du conteneur, jamais dans la reponse :
; une trace PHP renvoyee au client expose l'arborescence du serveur.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
