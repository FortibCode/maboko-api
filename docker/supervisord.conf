; nginx et php-fpm dans un meme conteneur : supervisor les demarre et
; redemarre celui qui tombe. Les deux journalisent sur la sortie standard,
; que Render affiche directement.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; Supervisor tourne sous root, et c'est voulu : les processus maitres de
; nginx et de php-fpm en ont besoin pour basculer leurs propres ouvriers
; sous « www-data », qui est l'utilisateur qui sert reellement les requetes.
; Sans cette ligne, supervisor s'en plaint a chaque demarrage par un message
; etiquete « CRIT » — un avertissement, pas une panne.
user=root

[program:php-fpm]
command=php-fpm --nodaemonize
; Demarre en premier : nginx ne sert a rien sans lui.
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; Le lancement passe par un script qui attend que php-fpm ecoute : sans lui,
; les requetes arrivees pendant le demarrage repartaient en 502.
command=/usr/local/bin/nginx-apres-fpm
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
